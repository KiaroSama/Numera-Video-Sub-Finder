[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/cli", "crates/ui", "crates/desktop", "xtask"]
default-members = ["crates/core", "crates/app", "crates/cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/KiaroSama/Numera-Video-Sub-Finder"

[workspace.dependencies]
nvsf-core = { path = "crates/core" }
nvsf-app = { path = "crates/app" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
sha2 = "=0.11.1"
clap = { version = "=4.6.7", features = ["derive"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
dirs = "=7.0.0"
tempfile = "=3.27.0"
fs2 = "=0.4.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
ndarray = "=0.17.2"
proptest = "=1.12.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
