[graph]
all-features = true

[advisories]
ignore = []
unmaintained = "workspace"
unsound = "all"

[licenses]
confidence-threshold = 0.93
include-dev = true
include-build = true
allow = [
    "GPL-3.0-or-later", "LGPL-2.1-or-later", "LGPL-3.0-or-later",
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "ISC",
    "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CC0-1.0", "Zlib",
    "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "WTFPL"
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
