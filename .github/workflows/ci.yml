name: Desktop CI
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: targets
        run: |
          jq -e '.schema == 1 and (.targets | length == 4) and .scope == "desktop-only"' ci/targets.json
          echo "matrix=$(jq -c '{include: .targets | map({id, runner, target, os, arch, triplet})}' ci/targets.json)" >> "$GITHUB_OUTPUT"
  native:
    needs: inventory
    runs-on: ${{ matrix.runner }}
    environment: ${{ github.ref == 'refs/heads/main' && 'numera-signing' || '' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      OMP_NUM_THREADS: 2
      NVSF_TARGET_ID: ${{ matrix.id }}
      CI_XTASK: ${{ format('{0}/.ci-work/tools/ci-xtask{1}', github.workspace, matrix.os == 'windows' && '.exe' || '') }}
      ORT_SKIP_DOWNLOAD: 1
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action source
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy, llvm-tools-preview
          targets: wasm32-unknown-unknown
      - name: Build uninstrumented CI helper
        timeout-minutes: 20
        env:
          CARGO_HOME: ${{ github.workspace }}/.ci-work/cargo
        run: |
          cargo build --release -p xtask --locked
          if ($LASTEXITCODE -ne 0) { throw 'CI helper build failed' }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/.ci-work/tools" | Out-Null
          $ext = if ($IsWindows) { '.exe' } else { '' }
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE/target/release/xtask$ext" -Destination $env:CI_XTASK -Force
      - name: Project-owned working directories
        run: |
          $work = Join-Path $env:GITHUB_WORKSPACE '.ci-work'
          foreach ($dir in 'temp','logs','captures','cargo','tools') { New-Item -ItemType Directory -Force -Path (Join-Path $work $dir) | Out-Null }
          $workTemp = Join-Path $work 'temp'
          $workCargo = Join-Path $work 'cargo'
          foreach ($name in 'TEMP','TMP','TMPDIR') { "$name=$workTemp" >> $env:GITHUB_ENV }
          "CARGO_HOME=$workCargo" >> $env:GITHUB_ENV
          'RUST_TEST_THREADS=2' >> $env:GITHUB_ENV
          'PROPTEST_CASES=128' >> $env:GITHUB_ENV
      - name: Hosted CI script regression contracts
        timeout-minutes: 2
        run: |
          & $env:CI_XTASK ci-guard-tests
          if ($LASTEXITCODE -ne 0) { throw 'Guard regression contracts failed' }
          $guardArgs = @('ci-frontend-tests')
          & $env:CI_XTASK ci-guard --name frontend-contracts --wall-seconds 20 --idle-seconds 10 --executable $env:CI_XTASK -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Frontend environment regression contracts failed' }
          $guardArgs = @('ci-notice-tests')
          & $env:CI_XTASK ci-guard --name notice-contracts --wall-seconds 20 --idle-seconds 10 --executable $env:CI_XTASK -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Native notice regression contracts failed' }
          if ($IsWindows) {
            $guardArgs = @('ci-authenticode-tests')
            & $env:CI_XTASK ci-guard --name authenticode-contracts --wall-seconds 60 --idle-seconds 30 --executable $env:CI_XTASK -- @guardArgs
            if ($LASTEXITCODE -ne 0) { throw 'Authenticode regression contracts failed' }
          }
      - name: Linux native prerequisites
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev unzip nasm cmake ninja-build autoconf autoconf-archive automake libtool libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 libarchive-tools gdb dbus-daemon xvfb xdotool wmctrl openbox fonts-dejavu-core fonts-noto-core fonts-noto-cjk
          if ($LASTEXITCODE -ne 0) { throw 'Linux prerequisites failed' }
      - name: Restore verified native dependency cache
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-work/native/binary-cache
          key: native-${{ matrix.id }}-${{ matrix.runner }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ci/native-lock.json', 'ci/ports/**', 'ci/triplets/*.cmake', 'xtask/src/ci_native*.rs') }}
      - name: Native dependency source builds and verified runtime
        id: native-provision
        run: |
          & $env:CI_XTASK ci-native --target-id '${{ matrix.id }}'
      - name: Retain successful native dependencies
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.native-provision.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-work/native/binary-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Native coverage instrumentation
        if: matrix.id == 'linux-x64'
        run: |
          & $env:CI_XTASK ci-coverage --phase start
          if ($LASTEXITCODE -ne 0) { throw 'Coverage instrumentation setup failed' }
      - name: Rust formatting
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
      - name: Locked dependency validation
        run: |
          cargo metadata --locked --no-deps --format-version 1 > .ci-work/workspace.json
          if ($LASTEXITCODE -ne 0) { throw 'Committed dependency lock mismatch' }
      - name: Native resource tools and approved icons
        run: |
          $guardArgs = @('install','tauri-cli','--version','2.12.4','--locked','--root','.ci-work/tools')
          & $env:CI_XTASK ci-guard --name tauri-install --wall-seconds 1200 --idle-seconds 180 --executable cargo -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Tauri CLI installation failed' }
          $guardArgs = @('--version')
          & $env:CI_XTASK ci-guard --name tauri-version --wall-seconds 15 --idle-seconds 5 --executable "$env:GITHUB_WORKSPACE/.ci-work/tools/bin/cargo-tauri$(if ($IsWindows) { '.exe' } else { '' })" --capture-stdout-path "$env:GITHUB_WORKSPACE/.ci-work/tools/tauri-version.txt" -- @guardArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($LASTEXITCODE -ne 0 -or [IO.File]::ReadAllText("$env:GITHUB_WORKSPACE/.ci-work/tools/tauri-version.txt",[Text.Encoding]::UTF8).Trim() -ne 'tauri-cli 2.12.4') { throw 'Installed Tauri CLI version mismatch' }
          "$env:GITHUB_WORKSPACE/.ci-work/tools/bin" >> $env:GITHUB_PATH
          $env:PATH = "$env:GITHUB_WORKSPACE/.ci-work/tools/bin$([IO.Path]::PathSeparator)$env:PATH"
          $guardArgs = @('generate-icons','--output','crates/desktop/icons')
          & $env:CI_XTASK ci-guard --name native-icons --wall-seconds 60 --idle-seconds 20 --executable $env:CI_XTASK -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Native icon generation failed' }
      - name: Core and native static analysis
        run: |
          $guardArgs = @('clippy','--locked','-vv','-p','nvsf-core','-p','nvsf-app','-p','nvsf-media-native','-p','nvsf-cli','-p','xtask','--','-D','warnings')
          & $env:CI_XTASK ci-guard --name rust-clippy --wall-seconds 1200 --idle-seconds 180 --executable cargo -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Rust static analysis failed' }
      - name: Same-target native media adapter and loader closure
        timeout-minutes: 35
        run: |
          $guardArgs = @('build','--locked','--release','--target','${{ matrix.target }}','-p','nvsf-media-native')
          & $env:CI_XTASK ci-guard --name media-adapter-release --wall-seconds 1800 --idle-seconds 360 --executable cargo -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Native media adapter build failed' }
          & $env:CI_XTASK ci-native --target-id '${{ matrix.id }}' --stage-media-adapter
          if ($LASTEXITCODE -ne 0) { throw 'Native media adapter loader staging failed' }
      - name: CLI and frontend build
        run: |
          $guardArgs = @('build','--locked','--release','-p','nvsf-cli','-p','xtask')
          & $env:CI_XTASK ci-guard --name native-release --wall-seconds 1800 --idle-seconds 360 --executable cargo -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Native CLI build failed' }
          $guardArgs = @('install','trunk','--version','0.22.1','--locked','--config','profile.release.lto="off"','--config','profile.release.codegen-units=16','--root','.ci-work/tools')
          & $env:CI_XTASK ci-guard --name trunk-install --wall-seconds 1200 --idle-seconds 180 --executable cargo -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Trunk installation failed' }
          "$env:GITHUB_WORKSPACE/.ci-work/tools/bin" >> $env:GITHUB_PATH
          $env:PATH = "$env:GITHUB_WORKSPACE/.ci-work/tools/bin$([IO.Path]::PathSeparator)$env:PATH"
      - name: Separate Windows x64 CUDA 12 CLI variant
        if: matrix.id == 'windows-x64'
        timeout-minutes: 40
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.ci-work/cuda-target
        run: |
          # Opt-in GPU variant only; the four CPU baseline products and their caches stay unchanged.
          $lock = [IO.File]::ReadAllText('ci/gpu-lock.json', [Text.Encoding]::UTF8) | ConvertFrom-Json
          $pin = $lock.variants.'windows-x64-cuda12'
          # Microsoft's official CUDA 12 NuGet feed; the GitHub release origin returned HTTP 404 from 2026-11-17.
          if ($lock.schema -ne 1 -or $pin.url -cne 'https://aiinfra.pkgs.visualstudio.com/2692857e-05ef-43b4-ba9c-ccf1c22c437c/_packaging/9387c3aa-d9ad-4513-968c-383f6f7f53b8/nuget/v3/flat2/microsoft.ml.onnxruntime.gpu.windows/1.31.0/microsoft.ml.onnxruntime.gpu.windows.1.31.0.nupkg' -or $pin.native -cne 'runtimes/win-x64/native') { throw 'GPU runtime pin is invalid' }
          $work = Join-Path $env:GITHUB_WORKSPACE '.ci-work/cuda'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $archive = Join-Path $work $pin.asset
          $guardArgs = @('--fail','--location','--proto','=https','--proto-redir','=https','--connect-timeout','30','--max-time','840','--output',$archive,$pin.url)
          & $env:CI_XTASK ci-guard --name cuda-ort-download --wall-seconds 900 --idle-seconds 180 --executable curl -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Pinned CUDA ONNX Runtime download failed' }
          if ((Get-Item -LiteralPath $archive).Length -ne $pin.bytes -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) { throw 'CUDA ONNX Runtime archive identity mismatch' }
          $variant = Join-Path $env:GITHUB_WORKSPACE '.ci-work/cuda-variant'
          $runtimes = Join-Path $variant 'runtimes'
          New-Item -ItemType Directory -Force -Path $runtimes | Out-Null
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            # Match exact package member paths; TensorRT and import libraries are not shipped.
            foreach ($name in @("$($pin.native)/onnxruntime.dll","$($pin.native)/onnxruntime_providers_shared.dll","$($pin.native)/onnxruntime_providers_cuda.dll",'LICENSE','ThirdPartyNotices.txt')) {
              $found = @($zip.Entries | Where-Object { $_.FullName -ceq $name })
              if ($found.Count -ne 1) { throw "CUDA runtime member missing or ambiguous: $name" }
              $entry = $found[0]
              if ($entry.Length -lt 1 -or $entry.Length -gt 1073741824) { throw "CUDA runtime member unbounded: $name" }
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $runtimes ([IO.Path]::GetFileName($name))), $false)
            }
          } finally { $zip.Dispose() }
          Remove-Item -LiteralPath $archive -Force
          $guardArgs = @('build','--locked','--release','-p','nvsf-cli','--features','cuda')
          & $env:CI_XTASK ci-guard --name cuda-cli-release --wall-seconds 1800 --idle-seconds 360 --executable cargo -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'CUDA CLI variant build failed' }
          Copy-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'release/nvsf.exe') -Destination (Join-Path $variant 'nvsf.exe')
          $files = @(Get-ChildItem -LiteralPath $variant -File -Recurse | ForEach-Object { [ordered]@{ file = [IO.Path]::GetRelativePath($variant, $_.FullName).Replace('\','/'); bytes = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() } })
          $manifest = [ordered]@{ schema = 1; variant = 'windows-x64-cuda12'; source_sha = $env:GITHUB_SHA; status = 'development-unqualified-gpu'; onnxruntime = $lock.onnxruntime; ort_package_sha256 = $pin.sha256; host_requirements = 'NVIDIA driver with CUDA 12 runtime, cuBLAS and cuDNN 9 supplied by the host; not bundled'; files = $files }
          [IO.File]::WriteAllText((Join-Path $variant 'gpu-variant.json'), ($manifest | ConvertTo-Json -Depth 4), [Text.UTF8Encoding]::new($false))
          Remove-Item -LiteralPath $env:CARGO_TARGET_DIR -Recurse -Force
      - name: Upload separate CUDA variant
        if: matrix.id == 'windows-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpu-windows-x64-cuda12-${{ github.sha }}
          path: .ci-work/cuda-variant/
          if-no-files-found: error
          retention-days: 7
      - name: Native Windows ARM frontend helpers
        if: matrix.id == 'windows-arm64'
        timeout-minutes: 30
        run: |
          & $env:CI_XTASK frontend-tools
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows ARM frontend helpers failed' }
      - name: Instrumented native GUI build
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          & $env:CI_XTASK ci-frontend --e2e
          if ($LASTEXITCODE -ne 0) { throw 'Instrumented Rust frontend build failed' }
          $guardArgs = @('build','--locked','--release','--timings','-vv','-p','nvsf-desktop','--features','e2e')
          & $env:CI_XTASK ci-guard --name instrumented-desktop --wall-seconds 1800 --idle-seconds 360 --executable cargo -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Instrumented native GUI build failed' }
          New-Item -ItemType Directory -Force -Path .ci-work/e2e | Out-Null
          Copy-Item "target/release/numera-video-sub-finder$ext" '.ci-work/e2e/'
          Copy-Item "target/release/nvsf$ext" '.ci-work/e2e/'
          Copy-Item '.ci-work/runtimes' '.ci-work/e2e/runtimes' -Recurse
          Copy-Item '.ci-work/runtimes' 'target/release/runtimes' -Recurse
          if ($IsWindows) {
            Get-ChildItem '.ci-work/runtimes' -Filter '*.dll' | Copy-Item -Destination '.ci-work/e2e/'
            Get-ChildItem '.ci-work/runtimes' -Filter '*.dll' | Copy-Item -Destination 'target/release/'
          }
      - name: All required Rust contract suites and nonzero evidence
        timeout-minutes: 45
        env:
          TARGET_ID: ${{ matrix.id }}
        run: |
          & $env:CI_XTASK ci-tests --target-id $env:TARGET_ID
          if ($LASTEXITCODE -ne 0) { throw 'Required Rust contract suites failed' }
      - name: Actual Rust media FFI AddressSanitizer admission
        if: matrix.id == 'linux-x64'
        timeout-minutes: 19
        run: |
          & $env:CI_XTASK ci-media-sanitizer
          if ($LASTEXITCODE -ne 0) { throw 'Native media sanitizer admission failed' }
      - name: Owned worker process fault contracts
        timeout-minutes: 2
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $xtask = Join-Path $env:GITHUB_WORKSPACE "target/release/xtask$ext"
          $guardArgs = @('worker-faults','--output','.ci-work/worker-faults')
          & $env:CI_XTASK ci-guard --name worker-faults --wall-seconds 80 --idle-seconds 20 --executable $xtask -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Owned worker fault or cleanup contract failed' }
          Copy-Item '.ci-work/worker-faults/worker-fault-report.json' '.ci-work/packages/reports/${{ matrix.id }}-worker-faults.json'
      - name: Missing-native bootstrap and maintenance CLI contracts
        timeout-minutes: 2
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $xtask = Join-Path $env:GITHUB_WORKSPACE "target/release/xtask$ext"
          $guardArgs = @('maintenance','--cli',"target/release/nvsf$ext",'--runtimes','.ci-work/runtimes','--output','.ci-work/maintenance')
          & $env:CI_XTASK ci-guard --name maintenance-cli --wall-seconds 90 --idle-seconds 30 --executable $xtask -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Actual bootstrap/maintenance CLI witness failed' }
          Copy-Item '.ci-work/maintenance/maintenance-report.json' '.ci-work/packages/reports/${{ matrix.id }}-maintenance.json'
      - name: Native desktop package build
        timeout-minutes: 30
        run: |
          & $env:CI_XTASK ci-frontend
          if ($LASTEXITCODE -ne 0) { throw 'Production frontend build failed' }
          $guardArgs = @('tauri','build','--no-bundle','--','--locked')
          & $env:CI_XTASK ci-guard --name desktop-production --wall-seconds 1800 --idle-seconds 360 --executable cargo --working-directory "$env:GITHUB_WORKSPACE/crates/desktop" -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Native desktop build failed' }
      - name: Actual model and extraction smoke
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $xtask = Join-Path $env:GITHUB_WORKSPACE "target/release/xtask$ext"
          $guardArgs = @('runtime-models','--data-root','.ci-work/data')
          & $env:CI_XTASK ci-guard --name provision-models --wall-seconds 1200 --idle-seconds 240 --executable $xtask -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Model provisioning failed' }
          $ffmpeg = ".ci-work/native/installed/${{ matrix.triplet }}/tools/ffmpeg/ffmpeg$ext"
          $guardArgs = @('fixtures','--ffmpeg',"$env:GITHUB_WORKSPACE/$ffmpeg",'--output','.ci-work/fixtures')
          & $env:CI_XTASK ci-guard --name generate-fixtures --wall-seconds 120 --idle-seconds 60 --executable $xtask -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Fixture generation failed' }
          $guardArgs = @('ocr-evidence','--ffmpeg',"$env:GITHUB_WORKSPACE/$ffmpeg",'--fixture-dir','.ci-work/fixtures','--data-root','.ci-work/data','--output','.ci-work/ocr-evidence')
          & $env:CI_XTASK ci-guard --name ocr-stage-evidence --wall-seconds 120 --idle-seconds 60 --executable $xtask -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Generated fixture OCR evidence capture failed' }
          $guardArgs = @('smoke','--cli',"target/release/nvsf$ext",'--fixture-dir','.ci-work/fixtures','--data-root','.ci-work/data')
          & $env:CI_XTASK ci-guard --name cli-smoke --wall-seconds 210 --idle-seconds 90 --executable $xtask -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Actual native extraction smoke failed' }
      - name: Actual native Japanese specialist numeric admission
        timeout-minutes: 3
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $xtask = Join-Path $env:GITHUB_WORKSPACE "target/release/xtask$ext"
          $guardArgs = @('specialist','--fixture-dir','.ci-work/fixtures','--data-root','.ci-work/data','--output','.ci-work/specialist')
          & $env:CI_XTASK ci-guard --name specialist --wall-seconds 120 --idle-seconds 60 --executable $xtask -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Actual specialist numeric model admission failed' }
          Copy-Item '.ci-work/specialist/specialist.json' '.ci-work/packages/reports/${{ matrix.id }}-specialist.json'
      - name: Explicit isolated optional visual model provisioning
        timeout-minutes: 21
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $xtask = Join-Path $env:GITHUB_WORKSPACE "target/release/xtask$ext"
          $guardArgs = @('visual-models','--data-root','.ci-work/visual-data')
          & $env:CI_XTASK ci-guard --name visual-models --wall-seconds 1200 --idle-seconds 60 --executable $xtask -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Hash-bound optional visual model provisioning failed' }
      - name: Actual supervised optional visual numeric admission
        timeout-minutes: 3
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $xtask = Join-Path $env:GITHUB_WORKSPACE "target/release/xtask$ext"
          $guardArgs = @('visual-model','--fixture-dir','.ci-work/fixtures','--data-root','.ci-work/visual-data','--output','.ci-work/visual-evidence')
          & $env:CI_XTASK ci-guard --name visual-model --wall-seconds 120 --idle-seconds 60 --executable $xtask -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Actual optional visual numeric model admission failed' }
          Copy-Item '.ci-work/visual-evidence/visual-model-report.json' '.ci-work/packages/reports/${{ matrix.id }}-visual-model.json'
      - name: Actual representative language extraction and cue recognition
        timeout-minutes: 9
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $xtask = Join-Path $env:GITHUB_WORKSPACE "target/release/xtask$ext"
          $ffmpeg = "$env:GITHUB_WORKSPACE/.ci-work/native/installed/${{ matrix.triplet }}/tools/ffmpeg/ffmpeg$ext"
          $guardArgs = @('multilingual','--cli',"$env:GITHUB_WORKSPACE/target/release/nvsf$ext",'--ffmpeg',$ffmpeg,'--data-root','.ci-work/data','--output','.ci-work/multilingual')
          & $env:CI_XTASK ci-guard --name multilingual --wall-seconds 510 --idle-seconds 90 --executable $xtask -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Actual representative multilingual OCR witness failed' }
          Copy-Item '.ci-work/multilingual/multilingual-report.json' '.ci-work/packages/reports/${{ matrix.id }}-multilingual.json'
      - name: Actual native GUI extraction and correction
        timeout-minutes: 5
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $xtask = Join-Path $env:GITHUB_WORKSPACE "target/release/xtask$ext"
          $args = @('gui','--gui',".ci-work/e2e/numera-video-sub-finder$ext",'--fixture-dir','.ci-work/fixtures','--data-root','.ci-work/data','--output','.ci-work/gui-evidence')
          if ($IsLinux) {
            $guardArgs = @('-a','-s','-screen 0 1600x1000x24','dbus-run-session','--',$xtask) + $args
            & $env:CI_XTASK ci-guard --name native-gui --wall-seconds 270 --idle-seconds 150 --executable xvfb-run -- @guardArgs
          } else {
            $guardArgs = $args
            & $env:CI_XTASK ci-guard --name native-gui --wall-seconds 270 --idle-seconds 150 --executable $xtask -- @guardArgs
          }
          if ($LASTEXITCODE -ne 0) { throw 'Actual native GUI acceptance failed' }
      - name: Assemble native artifact and provenance
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $xtask = Join-Path $env:GITHUB_WORKSPACE "target/release/xtask$ext"
          & $xtask package --target '${{ matrix.id }}' --cli "target/release/nvsf$ext" --gui "target/release/numera-video-sub-finder$ext" --runtimes '.ci-work/runtimes' --output '.ci-work/packages'
          if ($LASTEXITCODE -ne 0) { throw 'Native artifact assembly failed' }
      - name: Authenticated candidate runtime assets and actual native health
        timeout-minutes: 4
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $xtask = Join-Path $env:GITHUB_WORKSPACE "target/release/xtask$ext"
          $guardArgs = @('runtime-pack','--target','${{ matrix.id }}','--runtimes','.ci-work/runtimes','--output','.ci-work/packages/${{ matrix.id }}')
          & $env:CI_XTASK ci-guard --name runtime-pack --wall-seconds 180 --idle-seconds 60 --executable $xtask -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Runtime asset signature or actual native health failed' }
      - name: Relocated artifact-only extraction
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $xtask = Join-Path $env:GITHUB_WORKSPACE "target/release/xtask$ext"
          $guardArgs = @('standalone','--target','${{ matrix.id }}','--packages','.ci-work/packages','--fixture-dir','.ci-work/fixtures')
          & $env:CI_XTASK ci-guard --name standalone-smoke --wall-seconds 240 --idle-seconds 90 --executable $xtask -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Relocated package validation failed' }
      - name: Actual installer and archive formats
        timeout-minutes: 35
        env:
          # Selected development signing inputs reach only the Windows bundling step.
          NVSF_WINDOWS_CODESIGN_PFX: ${{ matrix.os == 'windows' && secrets.NVSF_WINDOWS_CODESIGN_PFX || '' }}
          NVSF_WINDOWS_CODESIGN_PASSWORD: ${{ matrix.os == 'windows' && secrets.NVSF_WINDOWS_CODESIGN_PASSWORD || '' }}
        run: |
          & $env:CI_XTASK ci-bundle --target-id '${{ matrix.id }}' --packages-root '.ci-work/packages'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Signed internal updater payload and metadata candidates
        timeout-minutes: 8
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $xtask = Join-Path $env:GITHUB_WORKSPACE "target/release/xtask$ext"
          $guardArgs = @('update-assets','--target','${{ matrix.id }}','--packages','.ci-work/packages')
          & $env:CI_XTASK ci-guard --name update-assets --wall-seconds 420 --idle-seconds 90 --executable $xtask -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Internal update candidate admission failed; no publication authorized' }
      - name: Actual production GUI without test listener
        timeout-minutes: 3
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $xtask = Join-Path $env:GITHUB_WORKSPACE "target/release/xtask$ext"
          $name = if ($IsWindows) { 'Numera Video Sub Finder.exe' } else { 'numera-video-sub-finder' }
          $gui = "$env:GITHUB_WORKSPACE/.ci-work/relocated/Numera 日本 portable ${{ matrix.id }}/$name"
          $args = @('production','--gui',$gui,'--data-root','.ci-work/production-data','--output','.ci-work/production-evidence')
          if ($IsLinux) {
            $guardArgs = @('-a','-s','-screen 0 1600x1000x24','dbus-run-session','--',$xtask,'virtual-desktop','--executable',$xtask,'--arguments-json',($args | ConvertTo-Json -Compress))
            & $env:CI_XTASK ci-guard --name production-gui --wall-seconds 90 --idle-seconds 30 --executable xvfb-run -- @guardArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $guardArgs = $args
            & $env:CI_XTASK ci-guard --name production-gui --wall-seconds 90 --idle-seconds 30 --executable $xtask -- @guardArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Copy-Item '.ci-work/production-evidence/production-gui-report.json' '.ci-work/packages/reports/${{ matrix.id }}-production.json'
          Copy-Item '.ci-work/gui-evidence/gui-report.json' '.ci-work/packages/reports/${{ matrix.id }}-gui.json'
      - name: Native coverage floors
        if: matrix.id == 'linux-x64'
        run: |
          & $env:CI_XTASK ci-coverage --phase report --target '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { throw 'Retained coverage floors failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.id }}-${{ github.sha }}
          path: |
            .ci-work/packages/
            .ci-work/gui-evidence/
            .ci-work/ocr-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Stage bounded visual and report evidence
        id: review_evidence
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          REVIEW_SOURCE_SHA: ${{ github.sha }}
          REVIEW_TARGET_ID: ${{ matrix.id }}
          REVIEW_JOB_STATE: ${{ job.status }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Log([ValidateSet('INFO','WARNING','ERROR','DEBUG')][string]$Level, [string]$Message) {
            Write-Host "[$([DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm:ss')) UTC] [$Level] [REVIEW-EVIDENCE] $Message"
          }
          try {
            $reviewRoot = Join-Path $env:GITHUB_WORKSPACE '.ci-work/review-evidence'
            New-Item -ItemType Directory -Path $reviewRoot | Out-Null
            $script:reviewFiles = [Collections.Generic.List[object]]::new()
            $script:reviewInvalidJson = [Collections.Generic.List[string]]::new()
            $script:reviewBytes = [long]0
            function Add-ReviewFile([IO.FileInfo]$File, [string]$Relative) {
              if (($File.Attributes -band ([IO.FileAttributes]::ReparsePoint -bor [IO.FileAttributes]::Directory)) -or $File.Length -gt 16MB -or $script:reviewFiles.Count -ge 128 -or $script:reviewBytes + $File.Length -gt 64MB) {
                throw "Unsafe or oversized review file: $Relative"
              }
              $destination = Join-Path $reviewRoot $Relative
              [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($destination)) | Out-Null
              [IO.File]::Copy($File.FullName, $destination, $false)
              $copied = Get-Item -LiteralPath $destination
              if ($copied.Length -ne $File.Length -or $script:reviewBytes + $copied.Length -gt 64MB) {
                throw "Changed input or review evidence exceeds 64MiB: $Relative"
              }
              if ($File.Extension -eq '.json') {
                $record = $null
                try { $record = Get-Content -LiteralPath $destination -Raw -Encoding utf8 | ConvertFrom-Json -AsHashtable }
                catch {
                  if ($env:REVIEW_JOB_STATE -eq 'success') { throw "Malformed review JSON: $Relative" }
                  $script:reviewInvalidJson.Add($Relative)
                  Log WARNING "Preserving incomplete JSON from failed native checks: $Relative"
                }
                if ($record -is [Collections.IDictionary] -and $record.Contains('source_sha')) {
                  if ($record.source_sha -cne $env:REVIEW_SOURCE_SHA -or ($record.Contains('target') -and $record.target -cne $env:REVIEW_TARGET_ID)) {
                    throw "Review report source or target differs: $Relative"
                  }
                }
              }
              $digest = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
              $script:reviewBytes += $copied.Length
              $script:reviewFiles.Add([ordered]@{path=$Relative; bytes=$copied.Length; sha256=$digest})
              Log DEBUG "Collected $Relative ($($copied.Length) bytes)"
            }
            function Add-ReviewGroup([string]$Source, [string]$Prefix, [string[]]$Patterns) {
              if (!(Test-Path -LiteralPath $Source)) { return }
              $directory = Get-Item -LiteralPath $Source -Force
              if (!$directory.PSIsContainer -or ($directory.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                throw "Review source must be an ordinary directory: $Prefix"
              }
              foreach ($file in (Get-ChildItem -LiteralPath $Source -File -Force | Sort-Object Name)) {
                if (@($Patterns | Where-Object { $file.Name -like $_ }).Count -gt 0) {
                  Add-ReviewFile $file "$Prefix/$($file.Name)"
                }
              }
            }
            $target = $env:REVIEW_TARGET_ID
            Add-ReviewGroup '.ci-work/gui-evidence' 'gui' @('*.png','*.json')
            Add-ReviewGroup '.ci-work/production-evidence' 'production' @('production-gui-report.json')
            Add-ReviewGroup '.ci-work/packages/reports' 'reports' @("$target.json","$target-*.json")
            if ($target -eq 'linux-x64') { Add-ReviewGroup '.ci-work/packages/reports' 'reports' @('coverage.json') }
            if (Test-Path -LiteralPath 'ci/coverage-scope.json') {
              Add-ReviewFile (Get-Item -LiteralPath 'ci/coverage-scope.json' -Force) 'metadata/coverage-scope.json'
            }
            $required = @('gui/actual-gui.png','gui/gui-report.json','production/production-gui-report.json','metadata/coverage-scope.json',"reports/$target.json")
            foreach ($kind in 'standalone','gui','production','suites','bundles','maintenance','multilingual','runtime-pack','update-assets','worker-faults','specialist','visual-model') {
              $required += "reports/$target-$kind.json"
            }
            if ($target -eq 'linux-x64') { $required += @('reports/coverage.json','reports/linux-x64-media-sanitizer.json') }
            $missing = @($required | Where-Object { $_ -cnotin $script:reviewFiles.path })
            if ($missing.Count -gt 0 -and $env:REVIEW_JOB_STATE -eq 'success') {
              throw "Successful native checks omitted required review evidence: $($missing -join ', ')"
            }
            if ($missing.Count -gt 0) { Log WARNING "Failed native checks left $($missing.Count) required review files unavailable" }
            $manifest = [ordered]@{
              schema=1; kind='native-review-evidence'; source_sha=$env:REVIEW_SOURCE_SHA; target=$target
              repository=$env:GITHUB_REPOSITORY; run_id=[long]$env:GITHUB_RUN_ID; run_attempt=[int]$env:GITHUB_RUN_ATTEMPT
              workflow_ref=$env:GITHUB_WORKFLOW_REF; producer_job_state=$env:REVIEW_JOB_STATE; generated_utc=[DateTime]::UtcNow.ToString('o')
              qualification='Receipts only; consult exact-source verification and report-specific limits'
              files=$script:reviewFiles.ToArray(); bytes=$script:reviewBytes; missing_required=$missing; invalid_json=$script:reviewInvalidJson.ToArray()
            }
            [IO.File]::WriteAllText((Join-Path $reviewRoot 'evidence-manifest.json'), ($manifest | ConvertTo-Json -Depth 8), [Text.UTF8Encoding]::new($false))
            Log INFO "Staged $($script:reviewFiles.Count) files and $script:reviewBytes bytes for $target; native state=$env:REVIEW_JOB_STATE"
          } catch {
            Log ERROR $_.Exception.Message
            throw
          }
      - name: Upload small review evidence
        if: ${{ !cancelled() && steps.review_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-${{ matrix.id }}-${{ github.sha }}
          path: .ci-work/review-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failed diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.id }}-${{ github.sha }}
          include-hidden-files: true
          path: |
            .ci-work/logs/
            .ci-work/data/logs/
            .ci-work/gui-evidence/
            .ci-work/fixtures/
            .ci-work/ocr-evidence/
            .ci-work/production-evidence/
            .ci-work/worker-faults/worker-fault-report.json
            .ci-work/specialist/specialist.json
            .ci-work/specialist/numeric-crop.png
            .ci-work/visual-evidence/visual-model-report.json
            .ci-work/visual-data/logs/
            .ci-work/coverage*.lcov
            .ci-work/packages/reports/coverage.json
            .ci-work/packages/reports/linux-x64-media-sanitizer.json
            target/cargo-timings/
            .ci-work/multilingual/*-extract.log
            .ci-work/multilingual/*.srt
            .ci-work/native/vcpkg/buildtrees/ffmpeg/*.log
            .ci-work/native/vcpkg/buildtrees/ffmpeg/*/ffbuild/config.log
          if-no-files-found: ignore
          retention-days: 7
  required:
    if: always()
    needs: [inventory, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fail on missing or failed native jobs
        env:
          INVENTORY: ${{ needs.inventory.result }}
          NATIVE: ${{ needs.native.result }}
        run: |
          test "$INVENTORY" = success
          test "$NATIVE" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*-${{ github.sha }}
          path: .ci-work/downloaded
          merge-multiple: true
      - name: Check four exact-source reports
        run: |
          for id in $(jq -r '.targets[].id' ci/targets.json); do
            jq -e --arg sha "$GITHUB_SHA" --arg id "$id" '.schema==1 and .source_sha==$sha and .target==$id and (.files|length>=2) and all(.files[]; (.sha256|test("^[a-f0-9]{64}$")))' ".ci-work/downloaded/packages/reports/$id.json"
            for kind in standalone gui production suites bundles maintenance multilingual runtime-pack update-assets worker-faults specialist visual-model; do
              minimum=1
              case "$kind" in
                standalone) minimum=3 ;; gui) minimum=9 ;; production) minimum=4 ;; worker-faults) minimum=5 ;;
                bundles|update-assets) minimum=2 ;; maintenance|runtime-pack) minimum=5 ;;
                multilingual) minimum=7; case "$id" in windows-*) minimum=6 ;; esac ;;
              esac
              jq -e --arg sha "$GITHUB_SHA" --arg id "$id" --argjson minimum "$minimum" '.schema==1 and .source_sha==$sha and .target==$id and .passed==true and .tests>=$minimum and .failed==0 and .skipped==0' ".ci-work/downloaded/packages/reports/$id-$kind.json"
            done
          done
          jq -e --arg sha "$GITHUB_SHA" '.schema==1 and .source_sha==$sha and .target=="linux-x64" and .profile=="actual-media-rust-ffi-asan" and .sanitizer=="address" and .instrumented_std==true and .passed==true and .tests>=6 and .failed==0 and .skipped==0 and .cleanup_verified==true' .ci-work/downloaded/packages/reports/linux-x64-media-sanitizer.json
          jq -e --arg sha "$GITHUB_SHA" '.source_sha==$sha and .passed==true and .coverage>=0.80 and .critical_coverage>=0.90' .ci-work/downloaded/packages/reports/coverage.json
