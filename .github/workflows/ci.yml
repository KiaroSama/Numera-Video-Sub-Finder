name: Desktop CI
on:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
permissions:
  contents: read
concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: targets
        run: |
          jq -e '.schema == 1 and (.targets | length == 6) and .scope == "desktop-only"' ci/targets.json
          echo "matrix=$(jq -c '{include: .targets | map({id, runner, target, os, arch, triplet})}' ci/targets.json)" >> "$GITHUB_OUTPUT"
  native:
    needs: inventory
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      OMP_NUM_THREADS: 2
      NVSF_TARGET_ID: ${{ matrix.id }}
      ORT_SKIP_DOWNLOAD: 1
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action source
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy, llvm-tools-preview
          targets: wasm32-unknown-unknown
      - name: Project-owned working directories
        run: |
          $work = Join-Path $env:GITHUB_WORKSPACE '.ci-work'
          foreach ($dir in 'temp','logs','captures','cargo','tools') { New-Item -ItemType Directory -Force -Path (Join-Path $work $dir) | Out-Null }
          foreach ($name in 'TEMP','TMP','TMPDIR') { "$name=$work/temp" >> $env:GITHUB_ENV }
          "CARGO_HOME=$work/cargo" >> $env:GITHUB_ENV
          'RUST_TEST_THREADS=2' >> $env:GITHUB_ENV
          'PROPTEST_CASES=128' >> $env:GITHUB_ENV
      - name: Hosted CI script regression contracts
        timeout-minutes: 2
        run: |
          ./scripts/ci/guard-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Guard regression contracts failed' }
          ./scripts/ci/guard.ps1 -Name frontend-contracts -WallSeconds 20 -IdleSeconds 10 -Executable pwsh -Arguments @('-NoLogo','-NoProfile','-NonInteractive','-File','scripts/ci/frontend-tests.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'Frontend environment regression contracts failed' }
      - name: Linux native prerequisites
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev nasm cmake ninja-build autoconf autoconf-archive automake libtool libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 libarchive-tools xvfb xdotool wmctrl openbox fonts-dejavu-core fonts-noto-core fonts-noto-cjk
          if ($LASTEXITCODE -ne 0) { throw 'Linux prerequisites failed' }
      - name: macOS native prerequisites
        if: matrix.os == 'macos'
        timeout-minutes: 20
        run: ./scripts/ci/guard.ps1 -Name macos-prerequisites -WallSeconds 900 -IdleSeconds 180 -Executable brew -Arguments @('install','nasm','autoconf','autoconf-archive','automake','libtool','pkg-config')
      - name: Restore verified native dependency cache
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-work/native/binary-cache
          key: native-${{ matrix.id }}-${{ matrix.runner }}-${{ hashFiles('vcpkg.json', 'ci/triplets/*.cmake', 'scripts/ci/native.ps1') }}
      - name: Native dependency source builds and verified runtime
        id: native-provision
        run: ./scripts/ci/native.ps1 -TargetId '${{ matrix.id }}'
      - name: Retain successful native dependencies
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.native-provision.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-work/native/binary-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Native coverage instrumentation
        if: matrix.id == 'linux-x64'
        run: ./scripts/ci/coverage.ps1 -Phase start
      - name: Rust formatting
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
      - name: Locked dependency validation
        run: |
          cargo metadata --locked --no-deps --format-version 1 > .ci-work/workspace.json
          if ($LASTEXITCODE -ne 0) { throw 'Committed dependency lock mismatch' }
      - name: Core and native static analysis
        run: |
          ./scripts/ci/guard.ps1 -Name rust-clippy -WallSeconds 1200 -IdleSeconds 180 -Executable cargo -Arguments @('clippy','--locked','-vv','-p','nvsf-core','-p','nvsf-app','-p','nvsf-media-native','-p','nvsf-cli','-p','xtask','--','-D','warnings')
          if ($LASTEXITCODE -ne 0) { throw 'Rust static analysis failed' }
      - name: Same-target native media adapter and loader closure
        timeout-minutes: 35
        run: |
          ./scripts/ci/guard.ps1 -Name media-adapter-release -WallSeconds 1800 -IdleSeconds 360 -Executable cargo -Arguments @('build','--locked','--release','--target','${{ matrix.target }}','-p','nvsf-media-native')
          if ($LASTEXITCODE -ne 0) { throw 'Native media adapter build failed' }
          ./scripts/ci/native.ps1 -TargetId '${{ matrix.id }}' -StageMediaAdapter
          if ($LASTEXITCODE -ne 0) { throw 'Native media adapter loader staging failed' }
      - name: CLI and frontend build
        run: |
          ./scripts/ci/guard.ps1 -Name native-release -WallSeconds 1800 -IdleSeconds 360 -Executable cargo -Arguments @('build','--locked','--release','-p','nvsf-cli','-p','xtask')
          if ($LASTEXITCODE -ne 0) { throw 'Native CLI build failed' }
          ./scripts/ci/guard.ps1 -Name trunk-install -WallSeconds 1200 -IdleSeconds 180 -Executable cargo -Arguments @('install','trunk','--version','0.21.14','--locked','--config','profile.release.lto="off"','--config','profile.release.codegen-units=16','--root','.ci-work/tools')
          if ($LASTEXITCODE -ne 0) { throw 'Trunk installation failed' }
          "$env:GITHUB_WORKSPACE/.ci-work/tools/bin" >> $env:GITHUB_PATH
          $env:PATH = "$env:GITHUB_WORKSPACE/.ci-work/tools/bin$([IO.Path]::PathSeparator)$env:PATH"
      - name: Native Windows ARM frontend helpers
        if: matrix.id == 'windows-arm64'
        timeout-minutes: 30
        run: ./scripts/ci/frontend-tools.ps1
      - name: Instrumented native GUI build
        run: |
          if ($IsMacOS -and '${{ matrix.arch }}' -eq 'x64') {
            $stage = Join-Path $env:GITHUB_WORKSPACE ('.ci-work/tools/tauri-stage-' + [Guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $stage -ErrorAction Stop | Out-Null
            $archive = Join-Path $stage 'tauri.zip'
            ./scripts/ci/guard.ps1 -Name tauri-download -WallSeconds 210 -IdleSeconds 60 -Executable curl -Arguments @('--fail','--location','--proto','=https','--proto-redir','=https','--connect-timeout','30','--max-time','180','--output',$archive,'https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.3/cargo-tauri-x86_64-apple-darwin.zip')
            if ($LASTEXITCODE -ne 0) { throw 'Official Intel Tauri CLI download failed' }
            if ((Get-Item -LiteralPath $archive).Length -ne 8403582 -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '333987e244ef46152c107d3e922313fd09cfd8e43cd851512609c2264348fc9b') { throw 'Official Tauri CLI archive identity mismatch' }
            $zip = [IO.Compression.ZipFile]::OpenRead($archive)
            try {
              $expected = @('LICENSE-APACHE-2.0','LICENSE-MIT','README.md','cargo-tauri')
              if ($zip.Entries.Count -ne $expected.Count) { throw 'Unexpected Tauri CLI archive inventory' }
              foreach ($entry in $zip.Entries) {
                if ($entry.FullName -notin $expected -or $entry.Length -lt 1 -or $entry.Length -gt 33554432 -or (($entry.ExternalAttributes -shr 16) -band 0xF000) -eq 0xA000) { throw 'Unsafe Tauri CLI archive entry' }
              }
              if (@($zip.Entries.FullName | Sort-Object -Unique).Count -ne $expected.Count) { throw 'Duplicate Tauri CLI archive entry' }
            } finally { $zip.Dispose() }
            $unpack = Join-Path $stage 'unpacked'
            Expand-Archive -LiteralPath $archive -DestinationPath $unpack -ErrorAction Stop
            $tool = Join-Path $unpack 'cargo-tauri'
            ./scripts/ci/guard.ps1 -Name tauri-architecture -WallSeconds 15 -IdleSeconds 5 -Executable lipo -Arguments @('-archs',$tool) -CaptureStdoutPath (Join-Path $stage 'architecture.txt')
            if ($LASTEXITCODE -ne 0 -or [IO.File]::ReadAllText((Join-Path $stage 'architecture.txt'),[Text.Encoding]::UTF8).Trim() -ne 'x86_64') { throw 'Tauri CLI is not the required native Intel binary' }
            $bin = Join-Path $env:GITHUB_WORKSPACE '.ci-work/tools/bin/cargo-tauri'
            Copy-Item -LiteralPath $tool -Destination $bin -ErrorAction Stop
            ./scripts/ci/guard.ps1 -Name tauri-mode -WallSeconds 15 -IdleSeconds 5 -Executable chmod -Arguments @('755',$bin)
            if ($LASTEXITCODE -ne 0) { throw 'Tauri CLI executable mode setup failed' }
          } else {
            ./scripts/ci/guard.ps1 -Name tauri-install -WallSeconds 1200 -IdleSeconds 180 -Executable cargo -Arguments @('install','tauri-cli','--version','2.12.3','--locked','--root','.ci-work/tools')
            if ($LASTEXITCODE -ne 0) { throw 'Tauri CLI installation failed' }
          }
          ./scripts/ci/guard.ps1 -Name tauri-version -WallSeconds 15 -IdleSeconds 5 -Executable "$env:GITHUB_WORKSPACE/.ci-work/tools/bin/cargo-tauri$(if ($IsWindows) { '.exe' } else { '' })" -Arguments @('--version') -CaptureStdoutPath "$env:GITHUB_WORKSPACE/.ci-work/tools/tauri-version.txt"
          if ($LASTEXITCODE -ne 0 -or [IO.File]::ReadAllText("$env:GITHUB_WORKSPACE/.ci-work/tools/tauri-version.txt",[Text.Encoding]::UTF8).Trim() -ne 'tauri-cli 2.12.3') { throw 'Installed Tauri CLI version mismatch' }
          if ($IsMacOS -and '${{ matrix.arch }}' -eq 'x64') { Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction Stop }
          "$env:GITHUB_WORKSPACE/.ci-work/tools/bin" >> $env:GITHUB_PATH
          $env:PATH = "$env:GITHUB_WORKSPACE/.ci-work/tools/bin$([IO.Path]::PathSeparator)$env:PATH"
          ./scripts/ci/guard.ps1 -Name native-icons -WallSeconds 60 -IdleSeconds 20 -Executable cargo -Arguments @('tauri','icon','assets/logo.svg','--output','crates/desktop/icons')
          if ($LASTEXITCODE -ne 0) { throw 'Native icon generation failed' }
          ./scripts/ci/frontend.ps1 -E2e
          if ($LASTEXITCODE -ne 0) { throw 'Instrumented Rust frontend build failed' }
          ./scripts/ci/guard.ps1 -Name instrumented-desktop -WallSeconds 1800 -IdleSeconds 360 -Executable cargo -Arguments @('build','--locked','--release','--timings','-vv','-p','nvsf-desktop','--features','e2e')
          if ($LASTEXITCODE -ne 0) { throw 'Instrumented native GUI build failed' }
          $ext = if ($IsWindows) { '.exe' } else { '' }
          New-Item -ItemType Directory -Force -Path .ci-work/e2e | Out-Null
          Copy-Item "target/release/numera-video-sub-finder$ext" '.ci-work/e2e/'
          Copy-Item "target/release/nvsf$ext" '.ci-work/e2e/'
          Copy-Item '.ci-work/runtimes' '.ci-work/e2e/runtimes' -Recurse
          Copy-Item '.ci-work/runtimes' 'target/release/runtimes' -Recurse
          if ($IsWindows) {
            Get-ChildItem '.ci-work/runtimes' -Filter '*.dll' | Copy-Item -Destination '.ci-work/e2e/'
            Get-ChildItem '.ci-work/runtimes' -Filter '*.dll' | Copy-Item -Destination 'target/release/'
          }
      - name: All required Rust contract suites and nonzero evidence
        timeout-minutes: 45
        run: ./scripts/ci/tests.ps1 -TargetId '${{ matrix.id }}'
      - name: Missing-native bootstrap and maintenance CLI contracts
        timeout-minutes: 2
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          ./scripts/ci/guard.ps1 -Name maintenance-cli -WallSeconds 90 -IdleSeconds 30 -Executable "$env:GITHUB_WORKSPACE/target/release/xtask$ext" -Arguments @('maintenance','--cli',"target/release/nvsf$ext",'--runtimes','.ci-work/runtimes','--output','.ci-work/maintenance')
          if ($LASTEXITCODE -ne 0) { throw 'Actual bootstrap/maintenance CLI witness failed' }
          Copy-Item '.ci-work/maintenance/maintenance-report.json' '.ci-work/packages/reports/${{ matrix.id }}-maintenance.json'
      - name: Native desktop package build
        timeout-minutes: 30
        run: |
          ./scripts/ci/frontend.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Production frontend build failed' }
          ./scripts/ci/guard.ps1 -Name desktop-production -WallSeconds 1800 -IdleSeconds 360 -Executable cargo -Arguments @('tauri','build','--no-bundle','--','--locked') -WorkingDirectory "$env:GITHUB_WORKSPACE/crates/desktop"
          if ($LASTEXITCODE -ne 0) { throw 'Native desktop build failed' }
      - name: Actual model and extraction smoke
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $xtask = "target/release/xtask$ext"
          ./scripts/ci/guard.ps1 -Name provision-models -WallSeconds 1200 -IdleSeconds 240 -Executable "$env:GITHUB_WORKSPACE/$xtask" -Arguments @('runtime-models','--data-root','.ci-work/data')
          if ($LASTEXITCODE -ne 0) { throw 'Model provisioning failed' }
          $ffmpeg = ".ci-work/native/installed/${{ matrix.triplet }}/tools/ffmpeg/ffmpeg$ext"
          ./scripts/ci/guard.ps1 -Name generate-fixtures -WallSeconds 120 -IdleSeconds 60 -Executable "$env:GITHUB_WORKSPACE/$xtask" -Arguments @('fixtures','--ffmpeg',"$env:GITHUB_WORKSPACE/$ffmpeg",'--output','.ci-work/fixtures')
          if ($LASTEXITCODE -ne 0) { throw 'Fixture generation failed' }
          ./scripts/ci/guard.ps1 -Name ocr-stage-evidence -WallSeconds 120 -IdleSeconds 60 -Executable "$env:GITHUB_WORKSPACE/$xtask" -Arguments @('ocr-evidence','--ffmpeg',"$env:GITHUB_WORKSPACE/$ffmpeg",'--fixture-dir','.ci-work/fixtures','--data-root','.ci-work/data','--output','.ci-work/ocr-evidence')
          if ($LASTEXITCODE -ne 0) { throw 'Generated fixture OCR evidence capture failed' }
          ./scripts/ci/guard.ps1 -Name cli-smoke -WallSeconds 210 -IdleSeconds 90 -Executable "$env:GITHUB_WORKSPACE/$xtask" -Arguments @('smoke','--cli',"target/release/nvsf$ext",'--fixture-dir','.ci-work/fixtures','--data-root','.ci-work/data')
          if ($LASTEXITCODE -ne 0) { throw 'Actual native extraction smoke failed' }
      - name: Actual representative language extraction and cue recognition
        timeout-minutes: 9
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $ffmpeg = "$env:GITHUB_WORKSPACE/.ci-work/native/installed/${{ matrix.triplet }}/tools/ffmpeg/ffmpeg$ext"
          ./scripts/ci/guard.ps1 -Name multilingual -WallSeconds 510 -IdleSeconds 90 -Executable "$env:GITHUB_WORKSPACE/target/release/xtask$ext" -Arguments @('multilingual','--cli',"$env:GITHUB_WORKSPACE/target/release/nvsf$ext",'--ffmpeg',$ffmpeg,'--data-root','.ci-work/data','--output','.ci-work/multilingual')
          if ($LASTEXITCODE -ne 0) { throw 'Actual representative multilingual OCR witness failed' }
          Copy-Item '.ci-work/multilingual/multilingual-report.json' '.ci-work/packages/reports/${{ matrix.id }}-multilingual.json'
      - name: Actual native GUI extraction and correction
        timeout-minutes: 5
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $args = @('gui','--gui',".ci-work/e2e/numera-video-sub-finder$ext",'--fixture-dir','.ci-work/fixtures','--data-root','.ci-work/data','--output','.ci-work/gui-evidence')
          if ($IsLinux) {
            ./scripts/ci/guard.ps1 -Name native-gui -WallSeconds 270 -IdleSeconds 150 -Executable xvfb-run -Arguments (@('-a',"$env:GITHUB_WORKSPACE/target/release/xtask$ext") + $args)
          } else {
            ./scripts/ci/guard.ps1 -Name native-gui -WallSeconds 270 -IdleSeconds 150 -Executable "$env:GITHUB_WORKSPACE/target/release/xtask$ext" -Arguments $args
          }
          if ($LASTEXITCODE -ne 0) { throw 'Actual native GUI acceptance failed' }
      - name: Assemble native artifact and provenance
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          & "target/release/xtask$ext" package --target '${{ matrix.id }}' --cli "target/release/nvsf$ext" --gui "target/release/numera-video-sub-finder$ext" --runtimes '.ci-work/runtimes' --output '.ci-work/packages'
          if ($LASTEXITCODE -ne 0) { throw 'Native artifact assembly failed' }
      - name: Authenticated candidate runtime assets and actual native health
        timeout-minutes: 4
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          ./scripts/ci/guard.ps1 -Name runtime-pack -WallSeconds 180 -IdleSeconds 60 -Executable "$env:GITHUB_WORKSPACE/target/release/xtask$ext" -Arguments @('runtime-pack','--target','${{ matrix.id }}','--runtimes','.ci-work/runtimes','--output','.ci-work/packages/${{ matrix.id }}')
          if ($LASTEXITCODE -ne 0) { throw 'Runtime asset signature or actual native health failed' }
      - name: Relocated artifact-only extraction
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          ./scripts/ci/guard.ps1 -Name standalone-smoke -WallSeconds 240 -IdleSeconds 90 -Executable "$env:GITHUB_WORKSPACE/target/release/xtask$ext" -Arguments @('standalone','--target','${{ matrix.id }}','--packages','.ci-work/packages','--fixture-dir','.ci-work/fixtures')
          if ($LASTEXITCODE -ne 0) { throw 'Relocated package validation failed' }
      - name: Actual installer and archive formats
        timeout-minutes: 35
        run: |
          ./scripts/ci/bundle.ps1 -TargetId '${{ matrix.id }}' -PackagesRoot '.ci-work/packages'
      - name: Signed internal updater payload and metadata candidates
        timeout-minutes: 8
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          ./scripts/ci/guard.ps1 -Name update-assets -WallSeconds 420 -IdleSeconds 90 -Executable "$env:GITHUB_WORKSPACE/target/release/xtask$ext" -Arguments @('update-assets','--target','${{ matrix.id }}','--packages','.ci-work/packages')
          if ($LASTEXITCODE -ne 0) { throw 'Internal update candidate admission failed; no publication authorized' }
      - name: Actual production GUI without test listener
        timeout-minutes: 3
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $name = if ($IsWindows) { 'Numera Video Sub Finder.exe' } else { 'numera-video-sub-finder' }
          $gui = "$env:GITHUB_WORKSPACE/.ci-work/relocated/Numera 日本 portable ${{ matrix.id }}/$name"
          $args = @('production','--gui',$gui,'--data-root','.ci-work/production-data','--output','.ci-work/production-evidence')
          if ($IsLinux) {
            ./scripts/ci/guard.ps1 -Name production-gui -WallSeconds 90 -IdleSeconds 30 -Executable xvfb-run -Arguments @('-a','pwsh','-NoProfile','-File','scripts/ci/virtual-desktop.ps1','-Executable',"$env:GITHUB_WORKSPACE/target/release/xtask$ext",'-ArgumentsJson',($args | ConvertTo-Json -Compress))
          } else {
            ./scripts/ci/guard.ps1 -Name production-gui -WallSeconds 90 -IdleSeconds 30 -Executable "$env:GITHUB_WORKSPACE/target/release/xtask$ext" -Arguments $args
          }
          Copy-Item '.ci-work/production-evidence/production-gui-report.json' '.ci-work/packages/reports/${{ matrix.id }}-production.json'
          Copy-Item '.ci-work/gui-evidence/gui-report.json' '.ci-work/packages/reports/${{ matrix.id }}-gui.json'
      - name: Native coverage floors
        if: matrix.id == 'linux-x64'
        run: ./scripts/ci/coverage.ps1 -Phase report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.id }}-${{ github.sha }}
          path: |
            .ci-work/packages/
            .ci-work/gui-evidence/
            .ci-work/ocr-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failed diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.id }}-${{ github.sha }}
          path: |
            .ci-work/logs/
            .ci-work/data/logs/
            .ci-work/gui-evidence/
            .ci-work/fixtures/
            .ci-work/ocr-evidence/
            target/cargo-timings/
            .ci-work/multilingual/*-extract.log
            .ci-work/multilingual/*.srt
            .ci-work/native/vcpkg/buildtrees/ffmpeg/*.log
            .ci-work/native/vcpkg/buildtrees/ffmpeg/*/ffbuild/config.log
          if-no-files-found: ignore
          retention-days: 7
  required:
    if: always()
    needs: [inventory, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fail on missing or failed native jobs
        env:
          INVENTORY: ${{ needs.inventory.result }}
          NATIVE: ${{ needs.native.result }}
        run: |
          test "$INVENTORY" = success
          test "$NATIVE" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*-${{ github.sha }}
          path: .ci-work/downloaded
          merge-multiple: true
      - name: Check six exact-source reports
        run: |
          for id in $(jq -r '.targets[].id' ci/targets.json); do
            jq -e --arg sha "$GITHUB_SHA" --arg id "$id" '.schema==1 and .source_sha==$sha and .target==$id and (.files|length>=2) and all(.files[]; (.sha256|test("^[a-f0-9]{64}$")))' ".ci-work/downloaded/reports/$id.json"
            for kind in standalone gui production suites bundles maintenance multilingual runtime-pack update-assets; do
              minimum=1
              case "$kind" in
                standalone) minimum=3 ;; gui) minimum=9 ;; production) minimum=4 ;;
                bundles|update-assets) minimum=2 ;; maintenance|runtime-pack) minimum=5 ;;
                multilingual) minimum=7; case "$id" in windows-*) minimum=6 ;; esac ;;
              esac
              jq -e --arg sha "$GITHUB_SHA" --arg id "$id" --argjson minimum "$minimum" '.schema==1 and .source_sha==$sha and .target==$id and .passed==true and .tests>=$minimum and .failed==0 and .skipped==0' ".ci-work/downloaded/reports/$id-$kind.json"
            done
          done
          jq -e --arg sha "$GITHUB_SHA" '.source_sha==$sha and .passed==true and .coverage>=0.80 and .critical_coverage>=0.90' .ci-work/downloaded/reports/coverage.json
