name: Supply-chain checks
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.1
      - name: Project-owned tool state
        run: |
          foreach ($dir in 'temp','logs','captures','cargo','tools') { New-Item -ItemType Directory -Force -Path ".ci-work/$dir" | Out-Null }
          "CARGO_HOME=$env:GITHUB_WORKSPACE/.ci-work/cargo" >> $env:GITHUB_ENV
          foreach ($name in 'TMP','TEMP','TMPDIR') { "$name=$env:GITHUB_WORKSPACE/.ci-work/temp" >> $env:GITHUB_ENV }
      - name: Reviewed metadata audit tools
        run: |
          ./scripts/ci/guard.ps1 -Name audit-install -WallSeconds 1200 -IdleSeconds 180 -Executable cargo -Arguments @('install','cargo-audit','--version','0.22.2','--locked','--root','.ci-work/tools')
          ./scripts/ci/guard.ps1 -Name deny-install -WallSeconds 1200 -IdleSeconds 180 -Executable cargo -Arguments @('install','cargo-deny','--version','0.20.2','--locked','--root','.ci-work/tools')
          "$env:GITHUB_WORKSPACE/.ci-work/tools/bin" >> $env:GITHUB_PATH
      - name: Advisory audit
        run: ./scripts/ci/guard.ps1 -Name dependency-audit -WallSeconds 180 -IdleSeconds 60 -Executable cargo -Arguments @('audit','--json') -CaptureStdoutPath '.ci-work/captures/audit.json'
      - name: License and source registry policy
        run: ./scripts/ci/guard.ps1 -Name dependency-policy -WallSeconds 300 -IdleSeconds 120 -Executable cargo -Arguments @('deny','--locked','check','licenses','sources','bans')
      - name: Tracked publication boundaries and strict UTF-8
        run: ./scripts/ci/source-policy.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: security-evidence-${{ github.sha }}
          path: |
            .ci-work/captures/audit.json
            .ci-work/logs/
          if-no-files-found: error
          retention-days: 7
