name: Supply-chain checks
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.100.0
      - name: Build uninstrumented CI helper
        timeout-minutes: 20
        env:
          CARGO_HOME: ${{ github.workspace }}/.ci-work/cargo
        run: cargo build --release -p xtask --locked
      - name: Project-owned tool state
        run: |
          foreach ($dir in 'temp','logs','captures','cargo','tools') { New-Item -ItemType Directory -Force -Path ".ci-work/$dir" | Out-Null }
          "CARGO_HOME=$env:GITHUB_WORKSPACE/.ci-work/cargo" >> $env:GITHUB_ENV
          foreach ($name in 'TMP','TEMP','TMPDIR') { "$name=$env:GITHUB_WORKSPACE/.ci-work/temp" >> $env:GITHUB_ENV }
      - name: Reviewed metadata audit tools
        run: |
          $guardArgs = @('install','cargo-audit','--version','0.22.2','--locked','--root','.ci-work/tools')
          ./target/release/xtask ci-guard --name audit-install --wall-seconds 1200 --idle-seconds 180 --executable cargo -- @guardArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $guardArgs = @('install','cargo-deny','--version','0.20.2','--locked','--root','.ci-work/tools')
          ./target/release/xtask ci-guard --name deny-install --wall-seconds 1200 --idle-seconds 180 --executable cargo -- @guardArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE/.ci-work/tools/bin" >> $env:GITHUB_PATH
      - name: Advisory audit
        run: |
          $guardArgs = @('audit','--json')
          ./target/release/xtask ci-guard --name dependency-audit --wall-seconds 180 --idle-seconds 60 --executable cargo --capture-stdout-path '.ci-work/captures/audit.json' -- @guardArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: License and source registry policy
        run: |
          $guardArgs = @('deny','--locked','check','licenses','sources','bans')
          ./target/release/xtask ci-guard --name dependency-policy --wall-seconds 300 --idle-seconds 120 --executable cargo -- @guardArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tracked publication boundaries and strict UTF-8
        run: ./target/release/xtask source-policy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: security-evidence-${{ github.sha }}
          path: |
            .ci-work/captures/audit.json
            .ci-work/logs/
          if-no-files-found: error
          retention-days: 7
