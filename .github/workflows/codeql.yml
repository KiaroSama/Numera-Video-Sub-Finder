name: CodeQL source analysis
on:
  workflow_call:
permissions:
  contents: read
  security-events: write
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          db-location: .ci-work/codeql/${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          category: /language:${{ matrix.language }}
          output: .ci-work/codeql-results
      - name: Reject nonempty security findings and absent scan
        shell: bash
        run: |
          shopt -s nullglob
          reports=(.ci-work/codeql-results/*.sarif)
          test "${#reports[@]}" -gt 0
          for report in "${reports[@]}"; do
            jq -e '(.runs|length)>0 and all(.runs[]; (.results|length)==0)' "$report"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: codeql-${{ matrix.language }}-${{ github.sha }}
          path: .ci-work/codeql-results/
          if-no-files-found: error
          retention-days: 7
