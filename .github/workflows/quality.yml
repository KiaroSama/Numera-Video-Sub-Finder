name: Portable quality
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      PROPTEST_CASES: 128
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.100.0
      - name: Build uninstrumented CI helper
        timeout-minutes: 20
        env:
          CARGO_HOME: ${{ github.workspace }}/.ci-work/cargo
        run: cargo build --release -p xtask --locked
      - name: Project-owned mutation state
        run: |
          foreach ($dir in 'temp','logs','captures','cargo','tools','mutation') { New-Item -ItemType Directory -Force -Path ".ci-work/$dir" | Out-Null }
          "CARGO_HOME=$env:GITHUB_WORKSPACE/.ci-work/cargo" >> $env:GITHUB_ENV
          foreach ($name in 'TMP','TEMP','TMPDIR') { "$name=$env:GITHUB_WORKSPACE/.ci-work/temp" >> $env:GITHUB_ENV }
      - name: Pinned mutation runner
        run: |
          $guardArgs = @('install','cargo-mutants','--version','27.1.0','--locked','--root','.ci-work/tools')
          ./target/release/xtask ci-guard --name mutants-install --wall-seconds 1200 --idle-seconds 180 --executable cargo -- @guardArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE/.ci-work/tools/bin" >> $env:GITHUB_PATH
      - name: Critical portable behavior mutation
        timeout-minutes: 95
        run: |
          $guardArgs = @('mutants','--caught','--unviable','--gitignore=true','-p','nvsf-core','--file','crates/core/src/time.rs','--file','crates/core/src/tracking.rs','--file','crates/core/src/export.rs','--file','crates/core/src/edit.rs','--jobs','1','--jobserver-tasks','2','--timeout','30','--build-timeout','300','--output','.ci-work/mutation','--cargo-arg','--locked','--','--','--test-threads=2')
          ./target/release/xtask ci-guard --name portable-mutants --wall-seconds 5400 --idle-seconds 240 --executable cargo -- @guardArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Nonzero mutation denominator and retained floor
        run: |
          ./target/release/xtask mutation --input '.ci-work/mutation/mutants.out/outcomes.json' --output '.ci-work/mutation/mutation-report.json'
          if ($LASTEXITCODE -ne 0) { throw 'Mutation result integrity/floor failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mutation-evidence-${{ github.sha }}
          path: |
            .ci-work/mutation/mutants.out/
            .ci-work/mutation/mutation-report.json
            .ci-work/logs/
          if-no-files-found: error
          retention-days: 7
  loom:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.100.0
      - name: Build uninstrumented CI helper
        timeout-minutes: 20
        env:
          CARGO_HOME: ${{ github.workspace }}/.ci-work/cargo
        run: cargo build --release -p xtask --locked
      - name: Project-owned model state
        run: |
          foreach ($dir in 'temp','logs','cargo') { New-Item -ItemType Directory -Force -Path ".ci-work/$dir" | Out-Null }
          "CARGO_HOME=$env:GITHUB_WORKSPACE/.ci-work/cargo" >> $env:GITHUB_ENV
          foreach ($name in 'TMP','TEMP','TMPDIR') { "$name=$env:GITHUB_WORKSPACE/.ci-work/temp" >> $env:GITHUB_ENV }
      - name: Actual production close-admission Loom model
        env:
          # These would otherwise admit zero or partial model exploration.
          LOOM_CHECKPOINT_INTERVAL: '1'
          LOOM_MAX_PERMUTATIONS: '1'
          LOOM_MAX_DURATION: '0'
          LOOM_MAX_PREEMPTIONS: '0'
          LOOM_CHECKPOINT_FILE: '.ci-work/loom/untrusted-checkpoint'
        run: |
          New-Item -ItemType Directory -Force -Path .ci-work/bin | Out-Null
          $guardArgs = @('--edition','2024','-O','scripts/ci/loom_runner.rs','-o','.ci-work/bin/loom-runner')
          ./target/release/xtask ci-guard --name loom-runner-build --wall-seconds 120 --idle-seconds 60 --executable rustc -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Loom runner compilation failed' }
          ./.ci-work/bin/loom-runner
          if ($LASTEXITCODE -ne 0) { throw 'Bounded Loom admission failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: loom-evidence-${{ github.sha }}
          path: |
            .ci-work/loom/loom-report.json
            .ci-work/loom/model.stdout
            .ci-work/loom/loom_*.log
            .ci-work/logs/
          if-no-files-found: error
          retention-days: 7
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 1
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.100.0
      - name: Build uninstrumented CI helper
        timeout-minutes: 20
        env:
          CARGO_HOME: ${{ github.workspace }}/.ci-work/cargo
        run: cargo build --release -p xtask --locked
      - name: Install pinned nightly tools
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: nightly-2026-10-27
          components: rust-src
      - name: Project-owned fuzz state
        run: |
          foreach ($dir in 'temp','logs','captures','cargo','tools') { New-Item -ItemType Directory -Force -Path ".ci-work/$dir" | Out-Null }
          "CARGO_HOME=$env:GITHUB_WORKSPACE/.ci-work/cargo" >> $env:GITHUB_ENV
          foreach ($name in 'TMP','TEMP','TMPDIR') { "$name=$env:GITHUB_WORKSPACE/.ci-work/temp" >> $env:GITHUB_ENV }
      - name: Pinned coverage-guided runner
        run: |
          $guardArgs = @('+nightly-2026-10-27','install','cargo-fuzz','--version','0.13.2','--locked','--root','.ci-work/tools')
          ./target/release/xtask ci-guard --name fuzz-install --wall-seconds 900 --idle-seconds 180 --executable cargo -- @guardArgs
          if ($LASTEXITCODE -ne 0) { throw 'Pinned cargo-fuzz installation failed' }
          "$env:GITHUB_WORKSPACE/.ci-work/tools/bin" >> $env:GITHUB_PATH
      - name: Bounded actual SRT parser fuzz admission
        timeout-minutes: 15
        run: ./target/release/xtask ci-fuzz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fuzz-evidence-${{ github.sha }}
          path: |
            .ci-work/fuzz/fuzz-report.json
            .ci-work/fuzz/artifacts/
            .ci-work/fuzz/logs/
            .ci-work/logs/
          if-no-files-found: error
          retention-days: 7
  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      PROPTEST_CASES: 8
      MIRIFLAGS: '-Zmiri-env-set=PROPTEST_DISABLE_FAILURE_PERSISTENCE=1 -Zmiri-env-set=PROPTEST_CASES=8 -Zmiri-env-set=PROPTEST_RNG_SEED=20261013'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.100.0
      - name: Build uninstrumented CI helper
        timeout-minutes: 20
        run: cargo build --release -p xtask --locked
      - name: Install pinned nightly tools
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: nightly-2026-10-12
          components: miri
      - name: Owned interpreter state
        run: |
          foreach ($dir in 'temp','logs','captures','cargo') { New-Item -ItemType Directory -Force -Path ".ci-work/$dir" | Out-Null }
          foreach ($name in 'TMP','TEMP','TMPDIR') { "$name=$env:GITHUB_WORKSPACE/.ci-work/temp" >> $env:GITHUB_ENV }
      - name: Miri portable public contracts
        timeout-minutes: 25
        run: |
          $guardArgs = @('+nightly-2026-10-12','miri','setup')
          ./target/release/xtask ci-guard --name miri-setup --wall-seconds 600 --idle-seconds 120 --executable cargo -- @guardArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $guardArgs = @('+nightly-2026-10-12','miri','test','--locked','-p','nvsf-core','--test','contracts','--test','editing','--test','boundaries','--','--test-threads=2')
          ./target/release/xtask ci-guard --name miri-core --wall-seconds 1200 --idle-seconds 180 --executable cargo -- @guardArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: miri-diagnostics-${{ github.sha }}
          path: .ci-work/logs/
          retention-days: 7
