name: Release qualification
on:
  workflow_dispatch:
    inputs:
      evidence_run:
        description: Exact Final verification run containing complete four-target qualification evidence
        required: true
        type: string
      publish_prerelease:
        description: Publish a GitHub development prerelease with four-target packages and SHA256SUMS.txt
        required: false
        default: false
        type: boolean
      prerelease_tag:
        description: Explicit prerelease tag (e.g. v0.1.0-dev.1) when publish_prerelease is true
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ inputs.evidence_run }}
          github-token: ${{ github.token }}
          pattern: desktop-*-${{ github.sha }}
          path: .ci-work/qualification
          merge-multiple: true
      - name: Verify four-target release matrix and SHA256SUMS inventory
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-work/release-assets
          : > .ci-work/release-assets/SHA256SUMS.txt
          for target in windows-x64 windows-arm64 linux-x64 linux-arm64; do
            bundle_report=".ci-work/qualification/reports/${target}-bundles.json"
            test -f "$bundle_report" || { echo "Missing required target bundle report: $target"; exit 1; }
            jq -e --arg sha "$SOURCE_SHA" --arg target "$target" '.source_sha==$sha and .target==$target and .passed==true and (.formats|length>=2)' "$bundle_report" >/dev/null
            sums=".ci-work/qualification/packages/${target}/SHA256SUMS.txt"
            test -f "$sums" || { echo "Missing SHA256SUMS.txt for $target"; exit 1; }
            (cd ".ci-work/qualification/packages/${target}" && sha256sum -c SHA256SUMS.txt)
            sed "s|  |  ${target}/|" "$sums" >> .ci-work/release-assets/SHA256SUMS.txt
          done
      - name: Fail closed on missing required full-release qualification evidence
        if: ${{ !inputs.publish_prerelease }}
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          report=.ci-work/qualification/reports/qualification.json
          jq -e --arg sha "$SOURCE_SHA" '.source_sha==$sha and .release_ready==true and all(.evidence[]; .state=="PASS") and (.families|length==30) and all(.families[]; (.id=="CT-23" and .state=="NOT_APPLICABLE") or (.state=="PASS" and .tests>0 and .source_sha==$sha)) and .metrics.coverage>=0.80 and .metrics.critical_coverage>=0.90 and .metrics.changed_line_coverage>=0.90 and .metrics.critical_mutation>=0.80' "$report"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checksums-${{ github.sha }}
          path: .ci-work/release-assets/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publication remains reviewer controlled
        if: ${{ !inputs.publish_prerelease }}
        run: echo 'Qualification does not publish, sign, merge or close a pull request.'

  prerelease:
    needs: qualification
    if: ${{ inputs.publish_prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ inputs.evidence_run }}
          github-token: ${{ github.token }}
          pattern: desktop-*-${{ github.sha }}
          path: .ci-work/qualification
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-checksums-${{ github.sha }}
          path: .ci-work/release-assets
      - name: Stage four-target assets and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ inputs.prerelease_tag }}" || { echo "prerelease_tag is required when publish_prerelease is true"; exit 1; }
          mkdir -p .ci-work/upload
          for target in windows-x64 windows-arm64 linux-x64 linux-arm64; do
            for f in .ci-work/qualification/packages/${target}/*; do
              base=$(basename "$f")
              [ "$base" = "SHA256SUMS.txt" ] && continue
              cp "$f" ".ci-work/upload/${target}-${base}"
            done
          done
          (cd .ci-work/upload && sha256sum * > SHA256SUMS.txt)
      - name: Attest staged four-target build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '.ci-work/upload/*'
      - name: Publish GitHub development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.prerelease_tag }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" .ci-work/upload/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --prerelease \
            --title "Numera Video Sub Finder $TAG (development prerelease)" \
            --notes "Exact-source four-target development prerelease (windows-x64, windows-arm64, linux-x64, linux-arm64) from commit $SOURCE_SHA. Windows binaries carry the owner self-signed development Authenticode signature (D-014); public CA trust and licensed real multilingual corpus qualification remain separate."
