[package]
name = "nvsf-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "numera-video-sub-finder"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
e2e = ["dep:tauri-plugin-webdriver"]

[dependencies]
nvsf-core.workspace = true
nvsf-app.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
tempfile.workspace = true
tokio = { version = "=1.53.3", features = ["time"] }
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls"] }
tauri-plugin-webdriver = { version = "=0.2.3", optional = true }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[lints]
workspace = true
