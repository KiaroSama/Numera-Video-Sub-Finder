[package]
name = "nvsf-parser-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
nvsf-core = { path = "../crates/core" }

[[bin]]
name = "parse_srt"
path = "fuzz_targets/parse_srt.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
